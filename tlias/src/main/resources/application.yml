server:
  port: 8080

spring:
  application:
    name: tlias-web-management
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tlias?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    # 运行时可通过环境变量 TLIAS_DB_PASSWORD 覆盖，默认 123456
    password: ${TLIAS_DB_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

tlias:
  jwt:
    secret: tlias-itheima-smart-learning-2024-secret-key
    expire-seconds: 43200   # 12 小时
  upload:
    dir: D:/tlias-images/
    base-url: /images/

logging:
  level:
    com.itheima: info
